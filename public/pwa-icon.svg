<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350f" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle / Rounded Tile -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="128" fill="url(#glow)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#fde68a" stroke-width="6" stroke-opacity="0.45"/>

  <!-- Inner Sewing Dashes -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="#fef3c7" stroke-width="4" stroke-dasharray="16 12" stroke-opacity="0.6"/>

  <!-- Stylized Haute Couture Pet Paw & Ribbon -->
  <g filter="url(#dropShadow)">
    <!-- Main Paw Pad (Heart / Shield shape) -->
    <path d="M 256 250 C 220 230 180 270 190 320 C 200 365 240 400 256 410 C 272 400 312 365 322 320 C 332 270 292 230 256 250 Z" fill="#fffdfa"/>
    
    <!-- Outer Toe Pads -->
    <ellipse cx="160" cy="225" rx="30" ry="42" transform="rotate(-25 160 225)" fill="#fffdfa"/>
    <ellipse cx="222" cy="180" rx="32" ry="46" transform="rotate(-8 222 180)" fill="#fffdfa"/>
    <ellipse cx="290" cy="180" rx="32" ry="46" transform="rotate(8 290 180)" fill="#fffdfa"/>
    <ellipse cx="352" cy="225" rx="30" ry="42" transform="rotate(25 352 225)" fill="#fffdfa"/>

    <!-- Gold Scissors / Needle Accent -->
    <path d="M 256 120 L 256 220" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <circle cx="256" cy="115" r="16" fill="none" stroke="#f59e0b" stroke-width="7"/>
    <circle cx="256" cy="115" r="4" fill="#fbbf24"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="2">
    petsimona25
  </text>
  <text x="256" y="482" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#fde68a" letter-spacing="3">
    ALTA COSTURA CANINA
  </text>
</svg>
